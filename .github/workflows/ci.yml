name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # サーバー境界までの実物テスト(ADR 0027)。tidepool のリスクの大半はここが
  # 吸収している。
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  # 実ブラウザでのみ見える React 配線層の昇格済みスモーク(ADR 0027 / 0055)。
  # サーバー境界の test job と失敗シグナルを分け、並列に走らせる。
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
