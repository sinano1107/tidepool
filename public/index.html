<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tidepool — queue</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.2rem; }
  ol { padding-left: 1.5rem; }
  li { margin: 0.5rem 0; }
  .status { font-size: 0.8rem; padding: 0.1rem 0.4rem; border-radius: 0.5rem; border: 1px solid currentColor; margin-left: 0.5rem; }
  .meta { opacity: 0.7; font-size: 0.85rem; }
</style>
</head>
<body>
<h1>Tidepool queue</h1>
<ol id="queue"><li class="meta">loading…</li></ol>
<script>
  fetch("/api/tasks")
    .then((r) => r.json())
    .then((all) => {
      const tasks = all.filter((t) => t.status === "todo" || t.status === "in_progress");
      const ol = document.getElementById("queue");
      ol.innerHTML = "";
      if (tasks.length === 0) {
        ol.innerHTML = '<li class="meta">queue is empty</li>';
        return;
      }
      for (const t of tasks) {
        const li = document.createElement("li");
        const title = document.createElement("strong");
        title.textContent = t.title;
        const status = document.createElement("span");
        status.className = "status";
        status.textContent = t.status;
        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = `${t.type}${t.assignee ? " · " + t.assignee : ""}`;
        li.append(title, status, meta);
        ol.append(li);
      }
    });
</script>
</body>
</html>
