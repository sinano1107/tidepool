<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tidepool — queue</title>
<style>
  :root {
    color-scheme: light dark;
    font-family: system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
    --muted: color-mix(in srgb, currentColor 55%, transparent);
    --card-bg: light-dark(#fff, #1c211f);
    --card-border: light-dark(#d8ded9, #333a36);
    --tide: light-dark(#2f7d6d, #5fb3a1);
    --rock: light-dark(#8a938e, #6f7873);
  }
  body { max-width: 440px; margin: 1.5rem auto; padding: 0 1rem; }
  h1 { font-size: 1.2rem; margin: 0 0 2px; }
  .sub { font-size: 0.85rem; color: var(--muted); margin: 0 0 16px; }
  .slotline { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 0.85rem; }
  .slotline .tag { font-family: var(--mono); font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.08em; }
  .slotbar { height: 2px; border-radius: 1px; margin-bottom: 14px; }
  .busy { color: var(--tide); background: var(--tide); }
  .free { color: var(--rock); background: var(--rock); }
  #queue { display: flex; flex-direction: column; gap: 6px; }
  .row {
    display: flex; align-items: center; gap: 10px;
    background: var(--card-bg); border: 1px solid var(--card-border);
    border-radius: 8px; padding: 10px 12px;
    user-select: none; -webkit-user-select: none; touch-action: none;
    cursor: grab; position: relative;
  }
  .row.dragging { cursor: grabbing; z-index: 5; box-shadow: 0 6px 14px rgba(23, 33, 30, 0.22); }
  .row .pos { font-family: var(--mono); font-size: 0.7rem; color: var(--muted); min-width: 1.2em; text-align: right; }
  .row .title { flex: 1; font-size: 0.9rem; font-weight: 500; }
  .row .type { font-family: var(--mono); font-size: 0.65rem; color: var(--muted); }
  .row button {
    font: inherit; font-size: 0.75rem; padding: 4px 10px;
    border: none; border-radius: 999px;
    background: color-mix(in srgb, var(--tide) 14%, transparent);
    color: var(--tide); cursor: pointer; flex-shrink: 0;
  }
  .meta { color: var(--muted); font-size: 0.85rem; }
  /* single-question answer view: one open question at a time, above the queue */
  .question {
    background: var(--card-bg); border: 1px solid var(--tide);
    border-radius: 10px; padding: 12px 14px; margin-bottom: 16px;
  }
  .question .tag {
    font-family: var(--mono); font-size: 0.65rem; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--tide);
  }
  .question h2 { font-size: 0.95rem; margin: 4px 0 2px; }
  .question .context { font-size: 0.8rem; color: var(--muted); margin: 0 0 10px; white-space: pre-wrap; }
  .question .options { display: flex; flex-direction: column; gap: 6px; }
  .question .options button {
    font: inherit; font-size: 0.85rem; text-align: left;
    padding: 8px 12px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--card-border); background: transparent; color: inherit;
  }
  .question .options button.recommended {
    border-color: var(--tide);
    background: color-mix(in srgb, var(--tide) 14%, transparent);
  }
  .question .options button.recommended::after {
    content: "recommended"; float: right;
    font-family: var(--mono); font-size: 0.6rem; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--tide); margin-top: 3px;
  }
  .question .override { display: flex; gap: 6px; margin-top: 10px; }
  .question .override input {
    flex: 1; font: inherit; font-size: 0.8rem; padding: 6px 10px;
    border: 1px solid var(--card-border); border-radius: 8px;
    background: transparent; color: inherit;
  }
  .question .override button {
    font: inherit; font-size: 0.75rem; padding: 4px 10px;
    border: none; border-radius: 999px; cursor: pointer;
    background: color-mix(in srgb, var(--rock) 18%, transparent); color: inherit;
  }
  /* decision log: a skim view over the event stream, newest first */
  .loghead { display: flex; align-items: baseline; gap: 8px; margin: 22px 0 8px; }
  .loghead h2 { font-size: 0.95rem; margin: 0; }
  .loghead .unread-count {
    font-family: var(--mono); font-size: 0.65rem; color: var(--tide);
  }
  .loghead button {
    font: inherit; font-size: 0.7rem; padding: 2px 10px; margin-left: auto;
    border: none; border-radius: 999px; cursor: pointer;
    background: color-mix(in srgb, var(--rock) 18%, transparent); color: inherit;
  }
  #log { display: flex; flex-direction: column; gap: 4px; }
  .entry {
    display: flex; align-items: baseline; gap: 8px;
    padding: 6px 10px; border-radius: 6px; font-size: 0.8rem;
    border-left: 2px solid transparent;
  }
  .entry .kind {
    font-family: var(--mono); font-size: 0.6rem; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--muted); flex-shrink: 0; min-width: 3.2em;
  }
  .entry .line { flex: 1; }
  .entry .who { font-family: var(--mono); font-size: 0.65rem; color: var(--muted); flex-shrink: 0; }
  /* a completion reads apart from an ordinary decision line at a glance */
  .entry.completion {
    border-left-color: var(--tide);
    background: color-mix(in srgb, var(--tide) 8%, transparent);
  }
  .entry.completion .kind { color: var(--tide); }
  .entry.unread { font-weight: 600; }
  .entry.unread::before { content: "●"; color: var(--tide); font-size: 0.5rem; align-self: center; }
</style>
</head>
<body>
<h1>Queue</h1>
<p class="sub">FIFO · new tasks append · reorder never resets · concurrency=1</p>
<div class="slotline"><span class="tag" id="slot-tag">slot</span><span id="slot-line" class="meta">loading…</span></div>
<div class="slotbar" id="slot-bar"></div>
<div id="question"></div>
<div id="queue"></div>
<div class="loghead">
  <h2>Log</h2>
  <span class="unread-count" id="log-unread"></span>
  <button id="log-mark-read" hidden>mark read</button>
</div>
<div id="log"><p class="meta">no entries yet</p></div>
<script>
  const queueEl = document.getElementById("queue");
  const questionEl = document.getElementById("question");
  let todos = [];
  let questions = [];
  let log = { entries: [], cursor: 0 };
  let dragging = false;

  async function load() {
    if (dragging) return; // a re-render mid-drag would yank the row out from under the pointer
    log = await fetch("/api/log").then((r) => r.json());
    const all = await fetch("/api/tasks").then((r) => r.json());
    // questions are human tasks answered here, not queue rows for the slot
    todos = all.filter((t) => t.status === "todo" && t.type !== "question");
    questions = all.filter((t) => t.status === "todo" && t.type === "question");
    const running = all.find((t) => t.status === "in_progress");
    const tag = document.getElementById("slot-tag");
    const line = document.getElementById("slot-line");
    const bar = document.getElementById("slot-bar");
    tag.className = "tag " + (running ? "busy" : "free");
    bar.className = "slotbar " + (running ? "busy" : "free");
    line.textContent = running ? `${running.title} — ${running.assignee}` : "slot free — nothing running";
    render();
  }

  // "Run now" IS a move to the head — the one reorder verb, no separate path.
  async function move(id, after) {
    await fetch(`/api/tasks/${id}/move`, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ after }),
    });
    await load();
  }

  async function answer(id, text) {
    await fetch(`/api/tasks/${id}/answer`, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ answer: text }),
    });
    await load();
  }

  // one question at a time: one-tap options, free text only as an override
  function renderQuestion() {
    questionEl.innerHTML = "";
    if (questions.length === 0) return;
    const q = questions[0];
    const card = document.createElement("div");
    card.className = "question";
    const tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = questions.length > 1 ? `question 1 of ${questions.length}` : "question";
    const title = document.createElement("h2");
    title.textContent = q.title;
    const context = document.createElement("p");
    context.className = "context";
    context.textContent = q.purpose;
    const options = document.createElement("div");
    options.className = "options";
    for (const opt of q.question_options ?? []) {
      const b = document.createElement("button");
      b.textContent = opt;
      if (opt === q.question_recommendation) b.classList.add("recommended");
      b.addEventListener("click", () => answer(q.id, opt));
      options.append(b);
    }
    const override = document.createElement("div");
    override.className = "override";
    const input = document.createElement("input");
    input.placeholder = "override with a free-text answer…";
    const send = document.createElement("button");
    send.textContent = "override";
    send.addEventListener("click", () => {
      if (input.value.trim()) answer(q.id, input.value.trim());
    });
    override.append(input, send);
    card.append(tag, title, context, options, override);
    questionEl.append(card);
  }

  async function markLogRead() {
    const latest = log.entries.at(-1);
    if (!latest) return;
    await fetch("/api/log/cursor", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ last_read: latest.id }),
    });
    await load();
  }
  document.getElementById("log-mark-read").addEventListener("click", markLogRead);

  // newest first for skimming; unread = beyond the cursor; a completion entry
  // reads apart from an ordinary decision line
  function renderLog() {
    const logEl = document.getElementById("log");
    const unreadEl = document.getElementById("log-unread");
    const markEl = document.getElementById("log-mark-read");
    logEl.innerHTML = "";
    if (log.entries.length === 0) {
      logEl.innerHTML = '<p class="meta">no entries yet</p>';
      unreadEl.textContent = "";
      markEl.hidden = true;
      return;
    }
    const unread = log.entries.filter((e) => e.id > log.cursor).length;
    unreadEl.textContent = unread ? `${unread} unread` : "";
    markEl.hidden = unread === 0;
    for (const e of [...log.entries].reverse()) {
      const row = document.createElement("div");
      const done = e.kind === "task_completed";
      row.className = "entry" + (done ? " completion" : "") + (e.id > log.cursor ? " unread" : "");
      const kind = document.createElement("span");
      kind.className = "kind";
      kind.textContent = done ? "done" : "note";
      const line = document.createElement("span");
      line.className = "line";
      line.textContent = done ? (e.payload.result ?? "(no outcome recorded)") : e.payload.line;
      const who = document.createElement("span");
      who.className = "who";
      who.textContent = e.worker_id;
      row.append(kind, line, who);
      logEl.append(row);
    }
  }

  function render() {
    renderQuestion();
    renderLog();
    queueEl.innerHTML = "";
    if (todos.length === 0) {
      queueEl.innerHTML = '<p class="meta">queue is empty</p>';
      return;
    }
    todos.forEach((t, i) => {
      const row = document.createElement("div");
      row.className = "row";
      row.dataset.id = t.id;
      const pos = document.createElement("span");
      pos.className = "pos";
      pos.textContent = i + 1;
      const title = document.createElement("span");
      title.className = "title";
      title.textContent = t.title;
      const type = document.createElement("span");
      type.className = "type";
      type.textContent = t.type;
      row.append(pos, title, type);
      // also on the head row: front on the head is the immediate-poll trigger
      const front = document.createElement("button");
      front.textContent = "↑";
      front.title = "Move to front";
      front.addEventListener("click", () => move(t.id, null));
      row.append(front);
      row.addEventListener("pointerdown", (e) => onDragStart(e, i, row));
      queueEl.append(row);
    });
  }

  function onDragStart(e, index, el) {
    if (e.target.closest("button") || e.button > 0) return;
    e.preventDefault();
    dragging = true;
    el.setPointerCapture(e.pointerId);
    const gap = 6;
    const shift = el.getBoundingClientRect().height + gap;
    const rows = [...queueEl.children];
    let projected = index;
    el.classList.add("dragging");

    const onMove = (ev) => {
      const dy = ev.clientY - e.clientY;
      el.style.transform = `translateY(${dy}px) scale(1.02)`;
      projected = Math.max(0, Math.min(todos.length - 1, Math.round(index + dy / shift)));
      rows.forEach((r, j) => {
        if (j === index) return;
        const off = j > index && j <= projected ? -shift : j < index && j >= projected ? shift : 0;
        r.style.transform = off ? `translateY(${off}px)` : "";
      });
    };
    const onUp = async () => {
      el.removeEventListener("pointermove", onMove);
      el.removeEventListener("pointerup", onUp);
      el.removeEventListener("pointercancel", onUp);
      el.classList.remove("dragging");
      el.style.transform = "";
      rows.forEach((r) => (r.style.transform = ""));
      dragging = false;
      if (projected !== index) {
        // after = the task that ends up right above the drop position
        const after = projected === 0 ? null : todos[projected < index ? projected - 1 : projected].id;
        await move(todos[index].id, after);
      }
    };
    el.addEventListener("pointermove", onMove);
    el.addEventListener("pointerup", onUp);
    el.addEventListener("pointercancel", onUp);
  }

  load();
  setInterval(load, 15000);
</script>
</body>
</html>
