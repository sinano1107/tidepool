<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>tidepool</title>
<!-- The human surface requires a credential (ADR 0036 / issue #153), and the browser
     fetches the manifest without one by default — this attribute sends the cookie -->
<link rel="manifest" href="/manifest.json" crossorigin="use-credentials">
<!-- Tab/bookmark favicon: symbol only, no background rect, so it reads
     cleanly at 16-32px against either a light or dark browser chrome -->
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<!-- iOS Safari's apple-touch-icon support for SVG is unreliable (a PNG is
     what its own tooling expects) — a rasterized copy at the recommended
     180x180, generated from icon.svg -->
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#1d6a66">
<!-- Web Push requires an installed PWA (CONTEXT.md's onboarding note, issue
     #14) — standalone mode is what "installed" means to iOS Safari -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="tidepool">
<link rel="stylesheet" href="/styles.css">
<script src="/vendor/react.js"></script>
<script src="/vendor/react-dom.js"></script>
<script src="/vendor/lucide.js"></script>

<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--rock-2); display: flex; justify-content: center; }
  #root { width: 100%; max-width: 440px; }
  /* tidal scrollbars — thin, sea-glass, pill-shaped */
  .tp-scroll { scrollbar-width: thin; scrollbar-color: var(--tide-2) transparent; }
  .tp-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
  .tp-scroll::-webkit-scrollbar-track { background: transparent; }
  .tp-scroll::-webkit-scrollbar-thumb { background: var(--tide-2); border-radius: 999px; border: 2px solid transparent; background-clip: padding-box; }
  .tp-scroll::-webkit-scrollbar-thumb:hover { background: var(--tide-3); border: 2px solid transparent; background-clip: padding-box; }
  .tp-scroll::-webkit-scrollbar-corner { background: transparent; }

  /* entrance drift — tidal: fade + small vertical rise */
  @keyframes tp-rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .tp-rise { animation: tp-rise var(--tp-rise-ms, 480ms) var(--ease-tidal) both; }

  /* tide wash — a wave sweeps up over the screen, then drains away */
  @keyframes tp-wash { 0% { transform: translateY(103%); } 38% { transform: translateY(-4%); } 58% { transform: translateY(-4%); } 100% { transform: translateY(103%); } }
  .tp-wash-water { animation: tp-wash 1250ms cubic-bezier(0.45, 0, 0.25, 1) both; }
  @keyframes tp-wash-label { 0%, 30% { opacity: 0; transform: translateY(8px); } 45%, 62% { opacity: 1; transform: none; } 80%, 100% { opacity: 0; transform: translateY(-8px); } }
  .tp-wash-label { animation: tp-wash-label 1250ms var(--ease-tidal) both; }
  @keyframes tp-bob { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(-18px); } }

  /* toast — surfaces up from below, sinks back on dismiss */
  @keyframes tp-toast-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes tp-toast-out { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateY(10px); } }
  .tp-toast-in { animation: tp-toast-in var(--duration-calm) var(--ease-tidal) both; }
  .tp-toast-out { animation: tp-toast-out var(--duration-calm) var(--ease-tidal) both; }

  /* tab switch — content drifts in from the side of travel */
  @keyframes tp-tab-right { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: none; } }
  @keyframes tp-tab-left { from { opacity: 0; transform: translateX(-18px); } to { opacity: 1; transform: none; } }
  .tp-tab-right { animation: tp-tab-right var(--duration-calm) var(--ease-tidal) both; }
  .tp-tab-left { animation: tp-tab-left var(--duration-calm) var(--ease-tidal) both; }

  @media (prefers-reduced-motion: reduce) {
    .tp-rise, .tp-wash-water, .tp-wash-label, .tp-toast-in, .tp-toast-out, .tp-tab-right, .tp-tab-left { animation: none; }
    .tp-wash-water { display: none; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script>
// The human surface requires a credential (ADR 0036 / issue #153). A device that
// lost its cookie — after a rotation, or after the cookie was cleared — gets a 401
// from every call, and the calls here would render that 401 JSON as if it were data
// (`.then(r => r.json())`). Catch it in one place and reload, so the board answers
// with its token-entry page: an installed PWA has no address bar, and that page is
// the only way back in. Wrapping fetch covers the bare `fetch('/api/...')` call
// sites too, not just api() below. Same-origin only — the board's own surface is
// the only thing this credential governs.
(function () {
  const nativeFetch = window.fetch.bind(window);
  let reloading = false;
  window.fetch = (...args) =>
    nativeFetch(...args).then((res) => {
      if (res.status === 401 && !reloading && new URL(res.url, location.href).origin === location.origin) {
        reloading = true;
        location.reload();
      }
      return res;
    });
})();
</script>
<!-- JSX sources are compiled ahead of time by scripts/build-webui-bundle.mjs. -->
<script src="/app.js"></script>
</body></html>
